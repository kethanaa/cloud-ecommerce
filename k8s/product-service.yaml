apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ghcr.io/kethanaa/product-service:latest
          env:
            - name: MONGO_URI
              value: "mongodb://admin:admin123@mongodb:27017/ecommerce?authSource=admin"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080